name: Publish tested mod to CurseForge

on:
  release:
    types: [published]

permissions:
  contents: write
  actions: read

concurrency:
  group: curseforge-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: vars.ENABLE_CURSEFORGE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: release
        name: Read the selected candidate from the release notes
        run: python tools/release_pipeline.py release-inputs
      - name: Verify the candidate came from this support branch's successful build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ steps.release.outputs.run }}
          BUILD_ATTEMPT: ${{ steps.release.outputs.attempt }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/attempts/$BUILD_ATTEMPT" > candidate-run.json
          python tools/release_pipeline.py check-run candidate-run.json
      - uses: actions/download-artifact@v8
        with:
          name: candidate-${{ steps.release.outputs.commit }}-${{ steps.release.outputs.attempt }}
          run-id: ${{ steps.release.outputs.run }}
          github-token: ${{ github.token }}
          path: candidate/
      - name: Verify the accepted JAR, source commit, manifest and checksum
        run: python tools/release_pipeline.py verify-candidate
      - name: Attach the exact binary to GitHub before the store upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MOD_FILE: ${{ steps.release.outputs.filename }}
        # No --clobber: a rerun stops here if this binary is already attached.
        # Inspect the store before reconciling any failed/unknown upload outcome.
        run: gh release upload "$RELEASE_TAG" "candidate/$MOD_FILE" candidate/candidate.json
      - name: Select CurseForge's minor tag and submit once
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_BASE: ${{ vars.CURSEFORGE_API_BASE }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_pipeline.py cf-request
          test -n "$CURSEFORGE_TOKEN"
          source cf-request.env
          curl --fail --silent --show-error --max-time 60 --retry 0 \
            --header "X-Api-Token: $CURSEFORGE_TOKEN" \
            "$CF_BASE/api/game/versions" --output cf-versions.json
          python tools/release_pipeline.py cf-metadata cf-versions.json
          curl --fail --silent --show-error --max-time 180 --retry 0 \
            --header "X-Api-Token: $CURSEFORGE_TOKEN" \
            --form 'metadata=<cf-metadata.json' \
            --form "file=@candidate/$CF_FILE;type=application/octet-stream" \
            "$CF_BASE/api/projects/$CF_PROJECT/upload-file" --output cf-response.json
          python tools/release_pipeline.py cf-receipt cf-response.json
      - name: Retain the confirmed CurseForge file ID
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" curseforge-upload.json
